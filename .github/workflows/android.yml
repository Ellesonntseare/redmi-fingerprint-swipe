name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: test -d "$ANDROID_HOME/platforms/android-35" || sdkmanager 'platforms;android-35'
      - run: test -d "$ANDROID_HOME/build-tools/34.0.0" || sdkmanager 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk FingerprintSwipe.apk
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/34.0.0/apksigner" verify FingerprintSwipe.apk'
      - uses: actions/upload-artifact@v4
        id: artifact
        continue-on-error: true
        with:
          name: FingerprintSwipe
          path: FingerprintSwipe.apk
          if-no-files-found: error
      - name: Preserve APK when artifact storage is unavailable
        if: steps.artifact.outcome == 'failure'
        shell: bash
        run: |
          sha256sum FingerprintSwipe.apk | sed 's/^/APK-SHA256 /'
          base64 -w 512 FingerprintSwipe.apk | sed 's/^/APK-B64 /'
